# Project identification
sonar.projectKey=notes-app
sonar.projectName=Notes Application
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=backend/server,frontend/notes-app/src
sonar.tests=backend/server/test,frontend/notes-app/test

# Exclusions
sonar.exclusions=**/node_modules/**,**/*.test.js,**/*.test.jsx,**/test/**,**/coverage/**,**/dist/**,**/build/**

# JavaScript/TypeScript specific settings
sonar.javascript.lcov.reportPaths=backend/server/coverage/lcov.info,frontend/notes-app/coverage/lcov.info

# Test execution reports
sonar.testExecutionReportPaths=backend/server/test-results/test-report.xml,frontend/notes-app/test-results/test-report.xml

# Code coverage
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/test/**,**/*.config.js

# Source file encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=js

# ESLint reports (if using ESLint)
# sonar.eslint.reportPaths=eslint-report.json

# File suffixes
sonar.javascript.file.suffixes=.js,.jsx

# Code quality rules
sonar.qualitygate.wait=true

# Duplication detection
sonar.cpd.exclusions=**/test/**,**/*.test.js,**/*.test.jsx
